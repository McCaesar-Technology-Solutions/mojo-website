name: One-time staging formatter

on:
  push:
    branches: [staging-preflight]
    paths:
      - ".github/workflows/format-staging.yml"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.ref == 'refs/heads/staging-preflight'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-preflight
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format tracked JavaScript and TypeScript files
        run: |
          git ls-files -z -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' | xargs -0 -r npx prettier --write

      - name: Commit formatting changes to staging-preflight only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx'
            git commit -m "style: format JavaScript and TypeScript for staging CI"
            git push origin HEAD:staging-preflight
          else
            echo "No formatting changes needed."
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
